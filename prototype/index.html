<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FXLAB Proto — Sample Browser VST</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #0a0a12;
    --bg-1: #12121f;
    --bg-2: #171727;
    --glass: rgba(30, 28, 54, 0.45);
    --glass-hi: rgba(45, 42, 78, 0.6);
    --stroke: rgba(140, 130, 255, 0.14);
    --stroke-hi: rgba(160, 150, 255, 0.35);
    --violet: #8b5cf6;
    --indigo: #6366f1;
    --cyan: #22d3ee;
    --cyan-dim: #0e7490;
    --text: #e6e4f5;
    --text-dim: #8b88a8;
    --text-faint: #5a5776;
    --glow-violet: 0 0 18px rgba(139, 92, 246, 0.55);
    --glow-cyan: 0 0 18px rgba(34, 211, 238, 0.5);
    --mono: 'Space Mono', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(99, 102, 241, 0.14), transparent 55%),
      radial-gradient(1000px 500px at 90% 110%, rgba(34, 211, 238, 0.10), transparent 55%),
      var(--bg-0);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  /* ---- Plugin window: tall floating VST panel ---- */
  .plugin {
    width: 420px;
    height: min(860px, calc(100vh - 40px));
    display: flex;
    flex-direction: column;
    background:
      linear-gradient(160deg, rgba(28, 26, 48, 0.92), rgba(14, 13, 26, 0.96));
    border: 1px solid var(--stroke);
    border-radius: 20px;
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      0 0 60px rgba(99, 102, 241, 0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    overflow: hidden;
    position: relative;
  }
  .plugin::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 1px;
    background: linear-gradient(160deg, rgba(139, 92, 246, 0.4), transparent 40%, transparent 70%, rgba(34, 211, 238, 0.3));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* ---- Header ---- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--stroke);
    background: linear-gradient(180deg, rgba(40, 36, 70, 0.4), transparent);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 28px; height: 28px; border-radius: 8px;
    background: conic-gradient(from 220deg, var(--violet), var(--cyan), var(--indigo), var(--violet));
    box-shadow: var(--glow-violet);
    position: relative;
  }
  .logo-dot::after {
    content: ''; position: absolute; inset: 5px; border-radius: 4px;
    background: var(--bg-1);
  }
  .brand-name { font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
  .brand-name span { color: var(--cyan); }
  .brand-sub { font-size: 9px; color: var(--text-faint); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

  .preset {
    display: flex; align-items: center; gap: 6px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 10px;
    padding: 5px 6px;
  }
  .preset button {
    width: 22px; height: 22px; border: none; border-radius: 6px;
    background: rgba(255,255,255,0.04); color: var(--text-dim);
    cursor: pointer; font-size: 12px; display: grid; place-items: center;
    transition: all 0.15s;
  }
  .preset button:hover { background: var(--violet); color: #fff; box-shadow: var(--glow-violet); }
  .preset-name {
    font-family: var(--mono); font-size: 11px; min-width: 92px; text-align: center;
    color: var(--text); font-weight: 700; letter-spacing: 0.3px;
  }

  /* ---- Tabs ---- */
  .tabs {
    display: flex; gap: 4px; padding: 10px 12px;
    overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--stroke);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 11px; border-radius: 10px;
    background: transparent; border: 1px solid transparent;
    color: var(--text-faint); cursor: pointer; transition: all 0.18s;
    font-size: 9px; font-weight: 700; letter-spacing: 0.6px;
  }
  .tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .tab:hover { color: var(--text-dim); background: rgba(255,255,255,0.03); }
  .tab.active {
    color: #fff;
    background: linear-gradient(160deg, rgba(139,92,246,0.28), rgba(34,211,238,0.14));
    border-color: var(--stroke-hi);
    box-shadow: inset 0 0 12px rgba(139,92,246,0.2);
  }
  .tab.active svg { stroke: var(--cyan); }

  /* ---- Search + Magic ---- */
  .toolbar { display: flex; gap: 8px; padding: 12px; }
  .search {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--glass); border: 1px solid var(--stroke);
    border-radius: 10px; padding: 0 12px;
  }
  .search:focus-within { border-color: var(--cyan); box-shadow: var(--glow-cyan); }
  .search svg { width: 14px; height: 14px; stroke: var(--text-faint); fill: none; stroke-width: 2; }
  .search input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--sans); font-size: 12px; padding: 9px 0;
  }
  .search input::placeholder { color: var(--text-faint); }
  .magic {
    display: flex; align-items: center; gap: 6px;
    padding: 0 14px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--violet), var(--indigo));
    color: #fff; font-weight: 800; font-size: 11px; letter-spacing: 0.5px;
    box-shadow: var(--glow-violet); transition: transform 0.12s, box-shadow 0.2s;
  }
  .magic:hover { transform: translateY(-1px); box-shadow: 0 0 26px rgba(139,92,246,0.75); }
  .magic:active { transform: translateY(0) scale(0.97); }
  .magic svg { width: 14px; height: 14px; fill: #fff; }

  /* ---- Sample list ---- */
  .list {
    flex: 1; overflow-y: auto; padding: 4px 12px 12px;
    display: flex; flex-direction: column; gap: 8px;
    scrollbar-width: thin; scrollbar-color: rgba(139,92,246,0.4) transparent;
  }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.4); border-radius: 3px; }

  .card {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center; gap: 10px;
    padding: 9px 11px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    cursor: grab;
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.1s, background 0.18s;
    position: relative;
  }
  .card:hover { border-color: var(--stroke-hi); background: var(--glass-hi); }
  .card.dragging { opacity: 0.5; cursor: grabbing; transform: scale(0.98); }
  .card.magic-hit {
    border-color: var(--cyan);
    box-shadow: var(--glow-cyan), inset 0 0 20px rgba(34,211,238,0.12);
    animation: magicPulse 0.6s ease;
  }
  @keyframes magicPulse {
    0% { transform: scale(1); } 40% { transform: scale(1.02); } 100% { transform: scale(1); }
  }
  .card.playing { border-color: var(--violet); box-shadow: var(--glow-violet); }

  .play-btn {
    width: 34px; height: 34px; flex: 0 0 auto;
    border: 1px solid var(--stroke-hi); border-radius: 9px;
    background: rgba(139,92,246,0.12); color: #fff; cursor: pointer;
    display: grid; place-items: center; transition: all 0.15s;
  }
  .play-btn:hover { background: var(--violet); box-shadow: var(--glow-violet); }
  .play-btn svg { width: 13px; height: 13px; fill: #fff; }

  .card-mid { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .card-name {
    font-size: 12px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wave { width: 100%; height: 22px; display: block; }
  .card-meta { display: flex; gap: 8px; align-items: center; }
  .chip {
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 5px; letter-spacing: 0.3px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--stroke);
    color: var(--text-dim);
  }
  .chip.bpm { color: var(--cyan); border-color: rgba(34,211,238,0.25); }
  .chip.key { color: var(--violet); border-color: rgba(139,92,246,0.3); }

  .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .toggle {
    display: flex; align-items: center; font-family: var(--mono);
    font-size: 8px; font-weight: 700; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--stroke); cursor: pointer; user-select: none;
  }
  .toggle span { padding: 3px 7px; transition: all 0.15s; color: var(--text-faint); }
  .toggle .dry.on { background: rgba(34,211,238,0.18); color: var(--cyan); }
  .toggle .fx.on { background: rgba(139,92,246,0.25); color: #fff; box-shadow: inset 0 0 8px rgba(139,92,246,0.4); }

  /* ---- Knobs panel ---- */
  .knobs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; padding: 14px 16px 16px;
    border-top: 1px solid var(--stroke);
    background: linear-gradient(0deg, rgba(30,26,54,0.5), transparent);
  }
  .knob-cell { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .knob {
    width: 66px; height: 66px; position: relative; cursor: ns-resize;
    touch-action: none;
  }
  .knob svg { width: 100%; height: 100%; transform: rotate(0deg); }
  .knob-label { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: var(--text-faint); }
  .knob-val {
    font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--cyan);
    min-height: 16px;
  }
  .knob-cell.pitch .knob-val { color: var(--cyan); }
  .knob-cell.key .knob-val { color: var(--violet); }
  .knob-cell.bpm .knob-val { color: #a5f3fc; }

  /* ---- Toast ---- */
  .toast-wrap {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; z-index: 50; width: 90%;
  }
  .toast {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 14px; border-radius: 11px;
    background: rgba(20,18,38,0.92); border: 1px solid var(--stroke-hi);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), var(--glow-violet);
    backdrop-filter: blur(12px);
    font-size: 11px; font-weight: 600; color: var(--text);
    animation: toastIn 0.25s ease, toastOut 0.3s ease 2.2s forwards;
  }
  .toast svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .toast .t-sub { font-family: var(--mono); font-size: 9px; color: var(--text-dim); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

  /* ---- Drop zone hint ---- */
  .plugin.drag-active::after {
    content: '⤓  Suelta para exportar el sample';
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(10,8,24,0.55); backdrop-filter: blur(3px);
    border: 2px dashed var(--cyan); border-radius: 20px; margin: 8px;
    color: var(--cyan); font-weight: 800; font-size: 13px; letter-spacing: 0.5px;
    box-shadow: inset var(--glow-cyan); pointer-events: none; z-index: 40;
  }

  .empty { text-align: center; color: var(--text-faint); font-size: 12px; padding: 40px 20px; }
</style>
</head>
<body>
  <div class="plugin" id="plugin">
    <!-- HEADER -->
    <div class="header">
      <div class="brand">
        <div class="logo-dot"></div>
        <div>
          <div class="brand-name">FX<span>LAB</span></div>
          <div class="brand-sub">Sample Browser</div>
        </div>
      </div>
      <div class="preset">
        <button id="presetPrev" title="Preset anterior">‹</button>
        <div class="preset-name" id="presetName">INIT</div>
        <button id="presetNext" title="Preset siguiente">›</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs" id="tabs"></div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Buscar sample…" autocomplete="off" />
      </label>
      <button class="magic" id="magicBtn">
        <svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/><circle cx="18" cy="17" r="1.4"/><circle cx="6" cy="18" r="1"/></svg>
        MAGIC
      </button>
    </div>

    <!-- LIST -->
    <div class="list" id="list"></div>

    <!-- KNOBS -->
    <div class="knobs">
      <div class="knob-cell pitch">
        <div class="knob" id="knobPitch" data-min="-12" data-max="12" data-val="0" data-step="1"></div>
        <div class="knob-label">PITCH</div>
        <div class="knob-val" id="valPitch">+0 st</div>
      </div>
      <div class="knob-cell key">
        <div class="knob" id="knobKey" data-min="0" data-max="11" data-val="0" data-step="1"></div>
        <div class="knob-label">KEY</div>
        <div class="knob-val" id="valKey">C</div>
      </div>
      <div class="knob-cell bpm">
        <div class="knob" id="knobBpm" data-min="60" data-max="180" data-val="120" data-step="1"></div>
        <div class="knob-label">BPM</div>
        <div class="knob-val" id="valBpm">120</div>
      </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>
  </div>

<script>
/* ============================================================
   FXLAB Proto — Sample Browser VST (UI/UX prototype)
   Mock data + Web Audio API preview (simple tones)
   ============================================================ */

// ---------- Mock data ----------
const CATEGORIES = [
  { id: 'all',       label: 'ALL FX',    icon: 'grid' },
  { id: 'accent',    label: 'ACCENT',    icon: 'zap' },
  { id: 'ambience',  label: 'AMBIENCE',  icon: 'cloud' },
  { id: 'breakdown', label: 'BREAKDOWN', icon: 'scissors' },
  { id: 'crash',     label: 'CRASH',     icon: 'burst' },
];

const ICONS = {
  grid:     '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  zap:      '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
  cloud:    '<path d="M6 16a4 4 0 010-8 5 5 0 019.6-1A4 4 0 0117 16z"/>',
  scissors: '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 8l12 8M8 16 20 8"/>',
  burst:    '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
};

const KEYS = ['C','C#m','D','Dm','Ebm','E','Fm','F#m','G','G#m','Am','Bbm','Bm','A','Gm'];
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const SAMPLE_NAMES = [
  ['Reggaeton Kick Dark', 'accent'],
  ['Vocal Chop Perreo', 'accent'],
  ['808 Slide Deep', 'accent'],
  ['Dembow Snare Punch', 'accent'],
  ['Neon Riser Sweep', 'ambience'],
  ['Vinyl Rain Texture', 'ambience'],
  ['Sub Drone Midnight', 'ambience'],
  ['Airy Pad Wash', 'ambience'],
  ['Reverse Cymbal Pull', 'breakdown'],
  ['Tape Stop Glitch', 'breakdown'],
  ['Filter Drop Impact', 'breakdown'],
  ['Silence Cut FX', 'breakdown'],
  ['Impact Crash Boom', 'crash'],
  ['White Noise Blast', 'crash'],
  ['Metal Hit Shatter', 'crash'],
  ['Cinematic Downer', 'crash'],
  ['Perc Roll Latino', 'accent'],
  ['Ghost Vocal Hook', 'ambience'],
  ['Trap Hat Skitter', 'accent'],
  ['Ocean Verb Tail', 'ambience'],
];

const PRESETS = ['INIT', 'PERREO INTENSO', 'DARK CLUB', 'LATIN TRAP', 'AMBIENT CHILL', 'FESTIVAL DROP'];

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// build sample objects
const SAMPLES = SAMPLE_NAMES.map((s, i) => ({
  id: i,
  name: s[0],
  category: s[1],
  bpm: rand(85, 150),
  key: pick(KEYS),
  fx: Math.random() > 0.5,      // DRY / FX state
  seed: Math.random() * 1000,   // waveform seed
  tone: 180 + Math.random() * 340, // base frequency for preview tone
}));

// ---------- State ----------
let activeCat = 'all';
let searchQuery = '';
let presetIdx = 0;
const knobState = { pitch: 0, key: 0, bpm: 120 };

// ---------- Web Audio ----------
let audioCtx = null;
let currentNodes = null;
let playingId = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function stopPreview() {
  if (currentNodes) {
    try { currentNodes.osc.stop(); } catch (e) {}
    currentNodes = null;
  }
  if (playingId !== null) {
    const el = document.querySelector('.card[data-id="' + playingId + '"]');
    if (el) el.classList.remove('playing');
    const pb = el && el.querySelector('.play-btn svg');
    if (pb) pb.innerHTML = ICON_PLAY;
    playingId = null;
  }
}

// pitch/bpm knobs modulate playbackRate-style multiplier on the preview tone
function pitchMultiplier() {
  const semis = knobState.pitch;
  const bpmRatio = knobState.bpm / 120;         // tempo target approximation
  return Math.pow(2, semis / 12) * (0.85 + 0.3 * (bpmRatio - 1) + 1 - 1);
}

function playPreview(sample) {
  const ctx = ensureAudio();
  stopPreview();

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  // FX toggle changes timbre: FX = filtered/resonant, DRY = clean
  osc.type = sample.fx ? 'sawtooth' : 'triangle';
  filter.type = 'lowpass';
  filter.frequency.value = sample.fx ? 1400 : 6000;
  filter.Q.value = sample.fx ? 8 : 0.7;

  const baseFreq = sample.tone * pitchMultiplier();
  const now = ctx.currentTime;
  osc.frequency.setValueAtTime(baseFreq, now);
  // little downward blip so it reads as a "hit"
  osc.frequency.exponentialRampToValueAtTime(Math.max(60, baseFreq * 0.6), now + 0.35);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

  osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.6);

  currentNodes = { osc, gain };
  osc.onended = () => {
    if (playingId === sample.id) {
      const el = document.querySelector('.card[data-id="' + sample.id + '"]');
      if (el) { el.classList.remove('playing'); const pb = el.querySelector('.play-btn svg'); if (pb) pb.innerHTML = ICON_PLAY; }
      playingId = null;
    }
  };

  playingId = sample.id;
  const el = document.querySelector('.card[data-id="' + sample.id + '"]');
  if (el) { el.classList.add('playing'); const pb = el.querySelector('.play-btn svg'); if (pb) pb.innerHTML = ICON_STOP; }
}

const ICON_PLAY = '<path d="M6 4l14 8-14 8z"/>';
const ICON_STOP = '<rect x="5" y="5" width="14" height="14" rx="2"/>';

// ---------- Waveform generator (SVG path from seed) ----------
function waveformPath(seed, samples = 48, w = 240, h = 22) {
  let s = seed;
  const rng = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const mid = h / 2;
  let d = '';
  const step = w / samples;
  const env = i => Math.sin((i / samples) * Math.PI); // amplitude envelope
  for (let i = 0; i <= samples; i++) {
    const amp = (rng() * 0.9 + 0.1) * env(i) * (mid - 1);
    const x = (i * step).toFixed(1);
    const yTop = (mid - amp).toFixed(1);
    d += (i === 0 ? 'M' : 'L') + x + ' ' + yTop + ' ';
  }
  for (let i = samples; i >= 0; i--) {
    const amp = (((seed + i * 7) % 100) / 100 * 0.7 + 0.2) * env(i) * (mid - 1);
    const x = (i * step).toFixed(1);
    const yBot = (mid + amp).toFixed(1);
    d += 'L' + x + ' ' + yBot + ' ';
  }
  return d + 'Z';
}

// ---------- Render ----------
const listEl = document.getElementById('list');
const tabsEl = document.getElementById('tabs');

function renderTabs() {
  tabsEl.innerHTML = CATEGORIES.map(c => `
    <button class="tab ${c.id === activeCat ? 'active' : ''}" data-cat="${c.id}">
      <svg viewBox="0 0 24 24">${ICONS[c.icon]}</svg>
      ${c.label}
    </button>`).join('');
}

function filtered() {
  return SAMPLES.filter(s =>
    (activeCat === 'all' || s.category === activeCat) &&
    s.name.toLowerCase().includes(searchQuery.toLowerCase())
  );
}

function renderList() {
  const items = filtered();
  if (!items.length) {
    listEl.innerHTML = '<div class="empty">Sin resultados en esta categoría 🌀</div>';
    return;
  }
  listEl.innerHTML = items.map(s => `
    <div class="card" data-id="${s.id}" draggable="true">
      <button class="play-btn" title="Play / Stop">
        <svg viewBox="0 0 24 24">${playingId === s.id ? ICON_STOP : ICON_PLAY}</svg>
      </button>
      <div class="card-mid">
        <div class="card-name">${s.name}</div>
        <svg class="wave" viewBox="0 0 240 22" preserveAspectRatio="none">
          <defs>
            <linearGradient id="wg${s.id}" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <path d="${waveformPath(s.seed)}" fill="url(#wg${s.id})" opacity="0.85"/>
        </svg>
        <div class="card-meta">
          <span class="chip bpm">${s.bpm} BPM</span>
          <span class="chip key">${s.key}</span>
        </div>
      </div>
      <div class="card-right">
        <div class="toggle" data-id="${s.id}" title="DRY / FX">
          <span class="dry ${s.fx ? '' : 'on'}">DRY</span>
          <span class="fx ${s.fx ? 'on' : ''}">FX</span>
        </div>
      </div>
    </div>`).join('');
}

// ---------- Events ----------
tabsEl.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  renderTabs(); renderList();
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

listEl.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = +card.dataset.id;
  const sample = SAMPLES.find(s => s.id === id);

  // toggle DRY/FX
  const tog = e.target.closest('.toggle');
  if (tog) {
    sample.fx = !sample.fx;
    tog.querySelector('.dry').classList.toggle('on', !sample.fx);
    tog.querySelector('.fx').classList.toggle('on', sample.fx);
    return;
  }

  // play / stop
  if (e.target.closest('.play-btn')) {
    if (playingId === id) { stopPreview(); }
    else { playPreview(sample); }
  }
});

// ---------- Preset selector ----------
const presetNameEl = document.getElementById('presetName');
function setPreset(delta) {
  presetIdx = (presetIdx + delta + PRESETS.length) % PRESETS.length;
  presetNameEl.textContent = PRESETS[presetIdx];
  presetNameEl.animate([{ opacity: 0.3 }, { opacity: 1 }], { duration: 220 });
}
document.getElementById('presetPrev').onclick = () => setPreset(-1);
document.getElementById('presetNext').onclick = () => setPreset(1);

// ---------- MAGIC ----------
document.getElementById('magicBtn').addEventListener('click', () => {
  const pool = filtered();
  if (!pool.length) { toast('🌀', 'Nada que elegir', 'Cambia de categoría'); return; }
  const chosen = pick(pool);
  renderList();
  const el = document.querySelector('.card[data-id="' + chosen.id + '"]');
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('magic-hit');
    setTimeout(() => el.classList.remove('magic-hit'), 700);
  }
  playPreview(chosen);
  toast('✨', 'MAGIC pick', chosen.name + ' · ' + chosen.bpm + ' BPM · ' + chosen.key);
});

// ---------- Knobs (drag to rotate) ----------
function fmtKnob(id, val) {
  if (id === 'knobPitch') return (val >= 0 ? '+' : '') + val + ' st';
  if (id === 'knobKey')   return NOTES[val];
  if (id === 'knobBpm')   return String(val);
}
function knobStateKey(id) { return id === 'knobPitch' ? 'pitch' : id === 'knobKey' ? 'key' : 'bpm'; }

function drawKnob(el) {
  const min = +el.dataset.min, max = +el.dataset.max, val = +el.dataset.val;
  const frac = (val - min) / (max - min);
  const startA = 135, sweep = 270;
  const ang = startA + frac * sweep;
  const r = 26, cx = 33, cy = 33;
  // arc track + value arc
  function arc(a0, a1, radius) {
    const p0 = polar(cx, cy, radius, a0), p1 = polar(cx, cy, radius, a1);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return `M ${p0.x} ${p0.y} A ${radius} ${radius} 0 ${large} 1 ${p1.x} ${p1.y}`;
  }
  const ind = polar(cx, cy, r - 4, ang);
  const indInner = polar(cx, cy, 10, ang);
  const color = el.id === 'knobKey' ? '#8b5cf6' : el.id === 'knobBpm' ? '#a5f3fc' : '#22d3ee';
  el.innerHTML = `
    <svg viewBox="0 0 66 66">
      <circle cx="33" cy="33" r="30" fill="rgba(10,8,22,0.6)" stroke="rgba(140,130,255,0.14)"/>
      <circle cx="33" cy="33" r="19" fill="rgba(30,26,54,0.7)" stroke="rgba(255,255,255,0.05)"/>
      <path d="${arc(startA, startA + sweep, r)}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" stroke-linecap="round"/>
      <path d="${arc(startA, ang, r)}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 4px ${color})"/>
      <line x1="${indInner.x}" y1="${indInner.y}" x2="${ind.x}" y2="${ind.y}" stroke="${color}" stroke-width="2.5" stroke-linecap="round" style="filter:drop-shadow(0 0 3px ${color})"/>
    </svg>`;
}
function polar(cx, cy, r, angDeg) {
  const a = (angDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

function setupKnob(id, valElId) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valElId);
  const min = +el.dataset.min, max = +el.dataset.max, step = +el.dataset.step;
  drawKnob(el);

  let dragging = false, startY = 0, startVal = 0;
  const update = v => {
    v = Math.max(min, Math.min(max, Math.round(v / step) * step));
    el.dataset.val = v;
    knobState[knobStateKey(id)] = v;
    valEl.textContent = fmtKnob(id, v);
    drawKnob(el);
  };
  const onMove = e => {
    if (!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const dy = startY - y;                       // up = increase
    const range = max - min;
    update(startVal + (dy / 140) * range);       // 140px = full sweep
    e.preventDefault();
  };
  const onUp = () => { dragging = false; document.body.style.cursor = ''; };
  const onDown = e => {
    dragging = true;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    startVal = +el.dataset.val;
    document.body.style.cursor = 'ns-resize';
    e.preventDefault();
  };
  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
  // wheel fine-tune
  el.addEventListener('wheel', e => {
    update(+el.dataset.val + (e.deltaY < 0 ? step : -step));
    e.preventDefault();
  }, { passive: false });
}

// ---------- Drag & drop "export" simulation ----------
const pluginEl = document.getElementById('plugin');
let dragSampleId = null;

listEl.addEventListener('dragstart', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  dragSampleId = +card.dataset.id;
  card.classList.add('dragging');
  e.dataTransfer.setData('text/plain', SAMPLES[dragSampleId].name);
  e.dataTransfer.effectAllowed = 'copy';
});
listEl.addEventListener('dragend', e => {
  const card = e.target.closest('.card');
  if (card) card.classList.remove('dragging');
  pluginEl.classList.remove('drag-active');

  // If released outside the list area -> "export"
  const listRect = listEl.getBoundingClientRect();
  const x = e.clientX, y = e.clientY;
  const outside = x < listRect.left || x > listRect.right || y < listRect.top || y > listRect.bottom;
  if (outside && dragSampleId !== null) {
    const s = SAMPLES[dragSampleId];
    toast('⤓', 'Sample exportado', s.name + '  →  ' + s.bpm + ' BPM · ' + s.key);
    console.log('[FXLAB] EXPORT drag-out:', { name: s.name, bpm: s.bpm, key: s.key, fx: s.fx });
  }
  dragSampleId = null;
});
// show drop hint when dragging over the window chrome (outside list)
pluginEl.addEventListener('dragover', e => {
  if (dragSampleId === null) return;
  const listRect = listEl.getBoundingClientRect();
  const outside = e.clientY < listRect.top || e.clientY > listRect.bottom;
  pluginEl.classList.toggle('drag-active', outside);
  e.preventDefault();
});

// ---------- Toast ----------
const toastWrap = document.getElementById('toastWrap');
function toast(icon, title, sub) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span style="font-size:15px">${icon}</span><div><div>${title}</div>${sub ? `<div class="t-sub">${sub}</div>` : ''}</div>`;
  toastWrap.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ---------- Init ----------
renderTabs();
renderList();
setupKnob('knobPitch', 'valPitch');
setupKnob('knobKey', 'valKey');
setupKnob('knobBpm', 'valBpm');
</script>
</body>
</html>
